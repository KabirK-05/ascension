name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `main` holds production code and accepts PRs from `staging` only.
  # GitHub rulesets cannot express "restrict the source branch", so this job is
  # the enforcement. See docs/DELIVERY.md.
  guard-release:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only staging may merge into main
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "::error::main accepts PRs from staging only; this PR is from '${{ github.head_ref }}'."
            echo "Cut your branch from staging and target staging. See docs/DELIVERY.md."
            exit 1
          fi
          echo "Release PR from staging — allowed."

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  # Pure-logic packages test on macOS with no simulator, so this is the fast,
  # cheap gate. The engines are the product (spec §8) and live here.
  packages:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package: [AscensionCore, AscensionEngines, ExportKit, SyncClient, SystemSurfaces]
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Test ${{ matrix.package }}
        run: swift test --package-path packages/${{ matrix.package }}

  # iOS-only packages: build for the simulator, and test the ones that have tests.
  # A package opts in by adding itself to the list in the test step below; it needs a
  # booted simulator, so it stays opt-in rather than running for every scaffold.
  ios-packages:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package: [DesignSystem, HealthBridge, FeatureToday, FeatureTrain, FeatureEat, FeatureTrends]
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build ${{ matrix.package }} for iOS
        working-directory: packages/${{ matrix.package }}
        run: |
          xcodebuild -scheme ${{ matrix.package }} \
            -destination 'generic/platform=iOS Simulator' \
            -quiet build

      - name: Resolve a simulator
        run: |
          IFS=$'\t' read -r udid name os < <("$GITHUB_WORKSPACE/scripts/ci-simulator.sh")
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          echo "Testing on $name (iOS $os) — $udid"

      - name: Test ${{ matrix.package }} on the simulator
        if: contains(fromJSON('["DesignSystem", "HealthBridge", "FeatureToday", "FeatureTrain", "FeatureEat", "FeatureTrends"]'), matrix.package)
        working-directory: packages/${{ matrix.package }}
        run: |
          bundle="$RUNNER_TEMP/${{ matrix.package }}.xcresult"
          set +e
          xcodebuild -scheme ${{ matrix.package }} \
            -destination "id=$SIMULATOR_ID" \
            -resultBundlePath "$bundle" \
            -quiet test
          test_status=$?
          set -e
          # `xcodebuild test` exits 0 having run nothing, and `-quiet` prints no count
          # at all, so the number of tests is asserted rather than assumed. ASC-26.
          "$GITHUB_WORKSPACE/scripts/assert-tests-ran.sh" "$bundle" "${{ matrix.package }}"
          exit $test_status

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install Tuist
        run: brew install tuist
      - name: Generate project
        run: tuist generate --no-open
      - name: Build app
        run: |
          xcodebuild -workspace Ascension.xcworkspace -scheme Ascension \
            -destination 'generic/platform=iOS Simulator' \
            -quiet build

      - name: Resolve a simulator
        run: |
          IFS=$'\t' read -r udid name os < <("$GITHUB_WORKSPACE/scripts/ci-simulator.sh")
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          echo "Testing on $name (iOS $os) — $udid"

      # The composition root is the only place the packages are actually joined up, so
      # its tests are the only ones that can catch a seam that no longer fits. They need
      # a booted simulator, which is why they run here rather than in the `packages` job.
      - name: Test the app shell on the simulator
        run: |
          bundle="$RUNNER_TEMP/app-shell.xcresult"
          set +e
          xcodebuild -workspace Ascension.xcworkspace -scheme Ascension \
            -destination "id=$SIMULATOR_ID" \
            -resultBundlePath "$bundle" \
            -quiet test
          test_status=$?
          set -e
          # The app's tests are all Swift Testing, and the only count xcodebuild
          # prints is XCTest's — which reads `Executed 0 tests` beside a full passing
          # run. The real numbers come out of the result bundle. ASC-26.
          "$GITHUB_WORKSPACE/scripts/assert-tests-ran.sh" "$bundle" "app shell"
          exit $test_status
